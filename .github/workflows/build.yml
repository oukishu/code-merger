name: Build and Package

on:
  workflow_dispatch:

jobs:
  build-matrix:
    name: Build Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build Binary
        run: |
          BINARY_NAME="code2prompt-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -v -o "$BINARY_NAME" main.go
          
          mkdir -p output
          mv "$BINARY_NAME" output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code2prompt
          path: output/
