name: Build and Package

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Build All Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build Binaries
        run: |
          mkdir -p output
          
          echo "Building Linux amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -v -o output/code2prompt-linux-amd64 main.go
          
          echo "Building macOS amd64..."
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -v -o output/code2prompt-darwin-amd64 main.go
          
          echo "Building Windows amd64..."
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -v -o output/code2prompt-windows-amd64.exe main.go

      - name: Upload All Binaries
        uses: actions/upload-artifact@v4
        with:
          name: code2prompt-all-platforms
          path: output/
